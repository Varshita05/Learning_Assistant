[project]
name = "learning-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Varshita05", email = "varshitaposani.05@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "logfire[fastapi,requests]>=5.1.0",
    "loguru>=0.7.3",
    "nemoguardrails>=0.14.0",
    "numpy>=2.5.3",
    "pdfplumber>=0.11.10",
    "portkey-ai>=2.3.4",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
learning-assistant = "learning_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
markers = ["integration: requires local files or external services"]
